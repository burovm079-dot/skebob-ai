<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Вход — SKEBOB AI</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#f4f6fb;font:16px system-ui,sans-serif}
    main{width:min(440px,calc(100% - 40px));padding:28px;border:1px solid #292e3b;border-radius:18px;background:#141822}
    h1{font-size:23px;margin:0 0 12px}p{color:#aeb5c5;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <h1>SKEBOB AI</h1>
    <p id="status">Проверяем ответ Telegram…</p>
  </main>
  <script>
    const SUPABASE_FUNCTION_URL = "https://krhjrhuejzhpaeukdimu.supabase.co/functions/v1/quick-function";
    // This must be the project's public anon/publishable key, never a service_role/secret key.
    const SUPABASE_ANON_KEY = "sb_publishable_4XLmIH-wG_gaakmLxuAqkg_U-Gc9ULP";

    async function finishLogin() {
      const status = document.querySelector("#status");
      const params = new URLSearchParams(location.search);
      const code = params.get("code");
      const returnedState = params.get("state");

      if (params.has("error")) throw new Error("Telegram не завершил вход.");
      const expectedState = sessionStorage.getItem("skebob_oidc_state");
      const verifier = sessionStorage.getItem("skebob_oidc_verifier");
      const nonce = sessionStorage.getItem("skebob_oidc_nonce");

      if (!code || !returnedState || !expectedState || returnedState !== expectedState ||
          !verifier || !nonce) {
        throw new Error("Проверка входа не пройдена. Вернись на сайт и начни авторизацию заново.");
      }
      if (SUPABASE_ANON_KEY.startsWith("REPLACE_")) {
        throw new Error("Нужно настроить публичный ключ Supabase на сайте.");
      }

      const response = await fetch(SUPABASE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ code, code_verifier: verifier, nonce })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.authenticated !== true) {
        throw new Error(data.error || "Telegram не удалось подтвердить.");
      }

      sessionStorage.removeItem("skebob_oidc_state");
      sessionStorage.removeItem("skebob_oidc_verifier");
      sessionStorage.removeItem("skebob_oidc_nonce");
      status.textContent = "Telegram успешно подтвердил личность. Постоянная сессия SKEBOB AI будет добавлена следующим этапом.";
      history.replaceState({}, document.title, location.pathname);
    }

    finishLogin().catch((error) => {
      document.querySelector("#status").textContent = error instanceof Error ? error.message : "Ошибка входа.";
    });
  </script>
</body>
</html>
