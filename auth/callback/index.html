<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Вход — SKEBOB AI</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#f4f6fb;font:16px system-ui,sans-serif}
    main{width:min(440px,calc(100% - 40px));padding:28px;border:1px solid #292e3b;border-radius:18px;background:#141822}
    h1{font-size:23px;margin:0 0 12px}p{color:#aeb5c5;line-height:1.6}a{color:#b9a5ff}
  </style>
</head>
<body>
  <main>
    <h1>Входим в SKEBOB AI…</h1>
    <p id="status">Проверяем ответ Telegram. Не закрывай эту страницу.</p>
  </main>
  <script>
    // Укажем URL Worker после его публикации.
    const API_BASE_URL = "";
    const REDIRECT_URI = "https://burovm079-dot.github.io/auth/callback/";

    async function finishLogin() {
      const status = document.querySelector("#status");
      const params = new URLSearchParams(location.search);
      const code = params.get("code");
      const returnedState = params.get("state");
      const error = params.get("error");

      if (error) throw new Error("Telegram отменил или не завершил вход.");
      const expectedState = sessionStorage.getItem("skebob_oidc_state");
      const verifier = sessionStorage.getItem("skebob_oidc_verifier");
      const nonce = sessionStorage.getItem("skebob_oidc_nonce");

      if (!code || !returnedState || !expectedState ||
          returnedState !== expectedState || !verifier || !nonce) {
        throw new Error("Проверка авторизации не пройдена. Вернись на сайт и начни вход заново.");
      }
      if (!API_BASE_URL) {
        throw new Error("Сервер входа ещё не опубликован. Попробуй позже.");
      }

      const response = await fetch(API_BASE_URL.replace(/\/$/, "") + "/auth/exchange", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code,
          code_verifier: verifier,
          nonce,
          redirect_uri: REDIRECT_URI
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Не удалось подтвердить вход.");

      sessionStorage.setItem("skebob_session_token", data.session_token);
      sessionStorage.setItem("skebob_user", JSON.stringify(data.user));
      sessionStorage.removeItem("skebob_oidc_state");
      sessionStorage.removeItem("skebob_oidc_verifier");
      sessionStorage.removeItem("skebob_oidc_nonce");
      status.textContent = "Вход подтверждён. Возвращаемся на SKEBOB AI…";
      location.replace("/");
    }

    finishLogin().catch((error) => {
      document.querySelector("#status").textContent = error.message;
    });
  </script>
</body>
</html>
