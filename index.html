<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <title>Skebob AI — Your creative workspace</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#0b0d12;--panel:#11141c;--panel2:#171b25;--line:#252a36;--muted:#858da1;--text:#f4f6fb;--accent:#a78bfa;--accent2:#70d6c2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 55% -20%,#282044 0,transparent 42%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
    button,textarea{font:inherit}button{cursor:pointer;color:inherit}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    aside{background:rgba(12,14,20,.88);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:25px}
    .brand{display:flex;align-items:center;gap:11px;padding:3px 8px;font:700 19px 'Space Grotesk',sans-serif;letter-spacing:-.6px}
    .logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#68d9c4);display:grid;place-items:center;color:#10121a;font-weight:800;font-size:18px;box-shadow:0 5px 22px #9d84f533}
    .new-chat{border:1px solid #6552a0;background:linear-gradient(110deg,#8d70e9,#6c60c8);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;box-shadow:0 8px 25px #8068dc25}
    .new-chat span{float:right;font-size:18px;line-height:16px}
    .section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#697185;padding:0 10px;margin-bottom:8px;font-weight:700}
    .nav{display:grid;gap:5px}.nav button,.history button{border:0;background:transparent;text-align:left;border-radius:9px;padding:10px;color:#aeb5c5;font-size:13px;display:flex;align-items:center;gap:11px}
    .nav button:hover,.history button:hover,.nav button.active{background:#1b1f2b;color:#fff}.ico{width:19px;text-align:center;color:#a99be8;font-size:16px}
    .history{display:grid;gap:3px}.history button{font-size:12px;color:#929bad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history button.active{background:#292340;color:#fff;border:1px solid #514276}
    .history button{width:100%;min-width:0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .side-bottom{margin-top:auto}.profile{display:flex;align-items:center;gap:10px;padding:13px 8px 2px;border-top:1px solid var(--line);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#293849;color:#9ee5d6;font-weight:700}.profile small{display:block;color:var(--muted);margin-top:2px}
    main{display:flex;flex-direction:column;min-width:0;min-height:100vh}.topbar{height:68px;border-bottom:1px solid #222632;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#0d1017a8;backdrop-filter:blur(16px)}
    .model{font-size:13px;color:#d9dced;background:#171b26;border:1px solid var(--line);border-radius:9px;padding:8px 11px}.model b{color:var(--accent2);font-weight:600}.top-actions{display:flex;gap:9px}.top-actions button{border:1px solid var(--line);background:#141822;border-radius:9px;padding:8px 11px;font-size:12px;color:#aeb5c5}
    .top-actions #telegramLogin{background:#292340;border-color:#6552a0;color:#eee8ff}
    .workspace{width:min(850px,calc(100% - 44px));margin:0 auto;display:flex;flex-direction:column;flex:1;padding:70px 0 28px}.welcome{text-align:center;margin:auto 0 35px}.spark{width:54px;height:54px;border-radius:18px;margin:0 auto 22px;background:linear-gradient(135deg,#a78bfa,#70d6c2);display:grid;place-items:center;color:#10121a;font-size:25px;box-shadow:0 12px 45px #9275dc3b}
    h1{font:600 clamp(30px,5vw,46px)/1.12 'Space Grotesk',sans-serif;letter-spacing:-1.8px;margin:0 0 13px}.gradient{background:linear-gradient(95deg,#c3a9ff,#7ce0cc);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{color:#929bad;font-size:14px;margin:0}
    .suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:27px auto 0;max-width:620px}.suggestion{border:1px solid #282e3c;background:#121620;border-radius:13px;padding:15px;text-align:left;transition:.2s}.suggestion:hover{border-color:#7663b8;transform:translateY(-2px);background:#191d29}.suggestion strong{font-size:12px;display:block;margin-bottom:5px}.suggestion small{color:#858da1;font-size:11px}.suggestion .ico{float:right}
    .conversation{display:none;flex-direction:column;gap:20px;margin-bottom:26px}.message{display:flex;gap:12px;align-items:flex-start}.message.user{flex-direction:row-reverse}.bubble{max-width:78%;padding:14px 17px;border:1px solid var(--line);border-radius:15px;background:#151923;font-size:14px;line-height:1.6;white-space:pre-wrap}.user .bubble{background:#292340;border-color:#4b3d71}.mini-avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#25203a;color:#c4b4ff;font-size:14px}
    .composer-wrap{position:sticky;bottom:0;margin-top:auto}.composer{border:1px solid #34394a;background:#151923;border-radius:17px;padding:12px 13px 10px;box-shadow:0 15px 50px #0006}.composer:focus-within{border-color:#7765b5;box-shadow:0 0 0 3px #a78bfa14,0 15px 50px #0006}textarea{width:100%;resize:none;min-height:52px;max-height:170px;border:0;outline:0;background:transparent;color:var(--text);padding:5px 6px;font-size:14px;line-height:1.5}textarea::placeholder{color:#737c90}.composer-tools{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 0}.toolset{display:flex;gap:7px}.toolset button{background:transparent;border:0;color:#8d96a9;padding:6px 8px;border-radius:8px;font-size:12px}.toolset button:hover{background:#252a38;color:white}.send{border:0;background:linear-gradient(135deg,#a78bfa,#78d9c7);color:#10131a;border-radius:10px;padding:9px 14px;font-weight:800}.hint{text-align:center;color:#626b7d;font-size:10px;margin:12px 0 0}
    @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.topbar{padding:0 16px;height:60px}.workspace{width:calc(100% - 28px);padding:55px 0 20px}.suggestions{grid-template-columns:1fr}.bubble{max-width:88%}.top-actions #share{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">✳</div>skebob<span style="color:#a78bfa">.ai</span></div>
    <button class="new-chat" id="newChat">＋ &nbsp; Новый чат <span>⌘ K</span></button>
    <div><div class="section-label">Рабочее пространство</div><div class="nav">
      <button class="active"><span class="ico">✧</span> Ассистент</button>
      <button><span class="ico">⌘</span> Исследования</button>
      <button><span class="ico">▧</span> Мои проекты</button>
      <button><span class="ico">◷</span> История</button>
    </div></div>
    <div><div class="section-label">Недавние чаты</div><div class="history" id="history"></div></div>
    <div class="side-bottom"><div class="nav"><button><span class="ico">⚙</span> Настройки</button><button><span class="ico">◈</span> Помощь и поддержка</button></div>
      <div class="profile"><div class="avatar" id="profileAvatar">S</div><div id="profileLabel">Мой аккаунт<small id="profilePlan">Бесплатный план</small></div><button id="logoutButton" hidden style="margin-left:auto;border:0;background:transparent;color:#aeb5c5;font-size:11px">Выйти</button></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><div class="model">Модель: <b>Skebob AI</b>　⌄</div><div class="top-actions"><button id="openBrowser" hidden>↗ Открыть в браузере</button><button id="telegramLogin">Войти через Telegram</button><button id="share">↗ Поделиться</button><button>Обновить план ✦</button></div></header>
    <section class="workspace">
      <div class="welcome" id="welcome">
        <div class="spark">✳</div>
        <h1>Твои идеи.<br/><span class="gradient">Новые возможности.</span></h1>
        <p class="subtitle">Я Skebob AI. Давай вместе создадим что-то классное.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Помоги придумать идею для нового проекта"><span class="ico">✧</span><strong>Придумать идею</strong><small>Найти вдохновение для проекта</small></button>
          <button class="suggestion" data-prompt="Напиши чистый и понятный код для моего проекта"><span class="ico">⌘</span><strong>Написать код</strong><small>Разобраться с задачей разработки</small></button>
          <button class="suggestion" data-prompt="Объясни сложную тему простыми словами"><span class="ico">◉</span><strong>Узнать новое</strong><small>Понятные объяснения и обучение</small></button>
          <button class="suggestion" data-prompt="Помоги составить план действий для моей цели"><span class="ico">↗</span><strong>Составить план</strong><small>Превратить цель в шаги</small></button>
        </div>
      </div>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <div class="composer-wrap"><div class="composer">
        <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.py,.xml" hidden />
        <div id="attachmentStatus" style="display:none;color:#9ee5d6;font-size:11px;padding:2px 6px 7px"></div>
        <textarea id="prompt" rows="2" placeholder="Спроси о чём угодно..."></textarea>
        <div class="composer-tools"><div class="toolset"><button id="attach">＋ Прикрепить</button><button id="mode">✧ Режим: обычный</button></div><button class="send" id="send">Отправить ↑</button></div>
      </div><p class="hint">Skebob AI может ошибаться. Проверяй важную информацию.</p></div>
    </section>
  </main>
</div>
<script>
  // Supabase Edge Function endpoint. The anon/publishable key is public; never use a service_role key here.
  const SUPABASE_FUNCTION_URL = 'https://krhjrhuejzhpaeukdimu.supabase.co/functions/v1/quick-function';
  const SUPABASE_ANON_KEY = 'sb_publishable_4XLmIH-wG_gaakmLxuAqkg_U-Gc9ULP';
  const TELEGRAM_CLIENT_ID = '9148855115';
  const REDIRECT_URI = 'https://burovm079-dot.github.io/skebob-ai/auth/callback/';
  const PUBLIC_APP_URL = 'https://burovm079-dot.github.io/skebob-ai/';
  // Local AI: the model runs in the visitor's browser via WebLLM. No paid API key is used.
  // Сначала пробуем более сильную модель 3B; если устройство не потянет — автоматически откатываемся.
  const WEBLLM_MODEL_ID = 'Qwen2.5-3B-Instruct-q4f16_1-MLC';
  const WEBLLM_FALLBACK_MODEL_IDS = [
    'Qwen2.5-1.5B-Instruct-q4f32_1-MLC',
    'Qwen2.5-0.5B-Instruct-q4f32_1-MLC'
  ];
  let aiEngine = null;
  let aiEnginePromise = null;
  const promptBox = document.querySelector('#prompt');
  const conversation = document.querySelector('#conversation');
  const welcome = document.querySelector('#welcome');
  const history = [];
  const CHAT_STORAGE_KEY = 'skebob_local_chat_v1';
  const chats = [];
  let activeChatId = null;
  let sending = false;
  let reasoningMode = false;
  let attachedContext = '';

  function activeChat() {
    return chats.find(chat => chat.id === activeChatId) || null;
  }

  function saveChat() {
    try {
      const current = activeChat();
      if (current) current.messages = history.slice(-80);
      localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify({
        chats: chats.slice(-30),
        activeChatId
      }));
      renderChatList();
    } catch (error) {
      console.warn('Не удалось сохранить историю Skebob AI:', error);
    }
  }

  function renderChatList() {
    const list = document.querySelector('#history');
    if (!list) return;
    list.replaceChildren();
    chats.slice().reverse().forEach(chat => {
      const item = document.createElement('div');
      item.style.cssText = 'display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px;';
      const openButton = document.createElement('button');
      openButton.type = 'button';
      openButton.textContent = '✦ ' + (chat.title || 'Новый чат');
      openButton.title = chat.title || 'Новый чат';
      openButton.classList.toggle('active', chat.id === activeChatId);
      openButton.style.cssText = 'min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      openButton.disabled = sending;
      openButton.addEventListener('click', () => openChat(chat.id));

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:1px;';
      const renameButton = document.createElement('button');
      renameButton.type = 'button';
      renameButton.textContent = '✎';
      renameButton.title = 'Переименовать чат';
      renameButton.setAttribute('aria-label', 'Переименовать чат');
      renameButton.style.cssText = 'padding:6px 7px;color:#aeb5c5;background:transparent;border:0;border-radius:6px;';
      renameButton.disabled = sending;
      renameButton.addEventListener('click', () => {
        const nextTitle = prompt('Новое название чата:', chat.title || 'Новый чат');
        if (nextTitle === null) return;
        const cleanTitle = nextTitle.trim().replace(/\\s+/g, ' ').slice(0, 48);
        if (!cleanTitle) {
          alert('Название не может быть пустым.');
          return;
        }
        chat.title = cleanTitle;
        saveChat();
      });

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.textContent = '×';
      deleteButton.title = 'Удалить чат';
      deleteButton.setAttribute('aria-label', 'Удалить чат');
      deleteButton.style.cssText = 'padding:6px 8px;color:#d69a9a;background:transparent;border:0;border-radius:6px;';
      deleteButton.disabled = sending;
      deleteButton.addEventListener('click', () => {
        if (!confirm('Удалить чат «' + (chat.title || 'Новый чат') + '»? Это действие нельзя отменить.')) return;
        const index = chats.findIndex(entry => entry.id === chat.id);
        if (index >= 0) chats.splice(index, 1);
        if (activeChatId === chat.id) {
          activeChatId = chats.length ? chats[chats.length - 1].id : null;
          history.length = 0;
          conversation.replaceChildren();
          if (activeChatId) {
            const nextChat = activeChat();
            history.push(...(nextChat?.messages || []));
            if (history.length) {
              welcome.style.display = 'none';
              conversation.style.display = 'flex';
              history.forEach(message => addMessage(message.content, message.role));
            } else {
              conversation.style.display = 'none';
              welcome.style.display = 'block';
            }
          } else {
            conversation.style.display = 'none';
            welcome.style.display = 'block';
          }
        }
        saveChat();
      });
      actions.append(renameButton, deleteButton);
      item.append(openButton, actions);
      list.append(item);
    });
  }

  function openChat(id) {
    if (sending) return;
    const chat = chats.find(item => item.id === id);
    if (!chat) return;
    const current = activeChat();
    if (current) current.messages = history.slice(-80);
    activeChatId = id;
    history.splice(0, history.length, ...(chat.messages || []));
    conversation.replaceChildren();
    if (history.length) {
      welcome.style.display = 'none';
      conversation.style.display = 'flex';
      history.forEach(item => addMessage(item.content, item.role));
    } else {
      conversation.style.display = 'none';
      welcome.style.display = 'block';
    }
    saveChat();
  }

  function createChat() {
    if (sending) return;
    const current = activeChat();
    if (current) current.messages = history.slice(-80);
    const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
    const chat = { id, title: 'Новый чат', messages: [] };
    chats.push(chat);
    activeChatId = id;
    history.length = 0;
    conversation.replaceChildren();
    conversation.style.display = 'none';
    welcome.style.display = 'block';
    promptBox.value = '';
    saveChat();
    promptBox.focus();
  }

  function restoreChat() {
    try {
      const saved = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '[]');
      if (Array.isArray(saved)) {
        const legacy = saved.filter(item =>
          item && (item.role === 'user' || item.role === 'assistant') &&
          typeof item.content === 'string'
        ).slice(-80);
        if (legacy.length) {
          chats.push({ id: 'legacy-' + Date.now(), title: legacy[0].content.slice(0, 34), messages: legacy });
        }
      } else if (saved && Array.isArray(saved.chats)) {
        saved.chats.slice(-30).forEach(chat => {
          if (!chat || typeof chat.id !== 'string' || !Array.isArray(chat.messages)) return;
          const messages = chat.messages.filter(item =>
            item && (item.role === 'user' || item.role === 'assistant') &&
            typeof item.content === 'string'
          ).slice(-80);
          chats.push({
            id: chat.id,
            title: typeof chat.title === 'string' ? chat.title.slice(0, 48) : 'Новый чат',
            messages
          });
        });
        if (chats.some(chat => chat.id === saved.activeChatId)) activeChatId = saved.activeChatId;
      }
      if (!activeChatId && chats.length) activeChatId = chats[chats.length - 1].id;
      if (activeChatId) {
        const selected = activeChat();
        history.push(...(selected?.messages || []));
        if (history.length) {
          welcome.style.display = 'none';
          conversation.style.display = 'flex';
          history.forEach(item => addMessage(item.content, item.role));
        }
      } else {
        createChat();
      }
      renderChatList();
      saveChat();
    } catch (error) {
      console.warn('Не удалось восстановить историю Skebob AI:', error);
      if (!chats.length) createChat();
    }
  }

  function randomBase64Url(length) {
    const bytes = crypto.getRandomValues(new Uint8Array(length));
    let binary = '';
    bytes.forEach(byte => binary += String.fromCharCode(byte));
    return btoa(binary).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
  }

  async function startTelegramLogin() {
    const telegramApp = window.Telegram?.WebApp;
    if (telegramApp?.initData) {
      try {
        telegramApp.ready();
        telegramApp.expand();
        const data = await authRequest({ action: 'miniapp-login', init_data: telegramApp.initData });
        if (!data.authenticated || !data.session_token || !data.user) throw new Error('Telegram не подтвердил вход.');
        sessionStorage.setItem('skebob_session_token', data.session_token);
        sessionStorage.setItem('skebob_user', JSON.stringify(data.user));
        showSignedIn(data.user);
        return;
      } catch (error) {
        alert(error instanceof Error ? error.message : 'Не удалось войти через Telegram Mini App.');
        return;
      }
    }
    if (SUPABASE_ANON_KEY.startsWith('REPLACE_')) {
      alert('Нужно добавить публичный Supabase anon/publishable key в настройки сайта. Не используй service_role или secret key.');
      return;
    }
    const state = randomBase64Url(32);
    const nonce = randomBase64Url(32);
    const verifier = randomBase64Url(64);
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    const challenge = (() => {
      const bytes = new Uint8Array(digest);
      let binary = '';
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    })();

    sessionStorage.setItem('skebob_oidc_state', state);
    sessionStorage.setItem('skebob_oidc_nonce', nonce);
    sessionStorage.setItem('skebob_oidc_verifier', verifier);

    const auth = new URL('https://oauth.telegram.org/auth');
    auth.search = new URLSearchParams({
      client_id: TELEGRAM_CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      response_type: 'code',
      scope: 'openid profile',
      state,
      nonce,
      code_challenge: challenge,
      code_challenge_method: 'S256'
    }).toString();
    location.assign(auth.toString());
  }


  async function authRequest(payload) {
    const response = await fetch(SUPABASE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Ошибка проверки аккаунта.');
    return data;
  }

  function showSignedOut() {
    document.querySelector('#profileAvatar').textContent = 'S';
    document.querySelector('#profileLabel').firstChild.textContent = 'Мой аккаунт';
    document.querySelector('#profilePlan').textContent = 'Бесплатный план';
    document.querySelector('#logoutButton').hidden = true;
    document.querySelector('#telegramLogin').textContent = 'Войти через Telegram';
  }

  function showSignedIn(user) {
    const label = user.display_name || (user.telegram_username ? '@' + user.telegram_username : 'Пользователь Telegram');
    document.querySelector('#profileAvatar').textContent = (label.trim()[0] || 'T').toUpperCase();
    document.querySelector('#profileLabel').firstChild.textContent = label;
    document.querySelector('#profilePlan').textContent = 'Вход через Telegram';
    document.querySelector('#logoutButton').hidden = false;
    document.querySelector('#telegramLogin').textContent = 'Аккаунт подключён';
  }

  async function refreshAuthState() {
    const token = sessionStorage.getItem('skebob_session_token');
    if (!token) return showSignedOut();
    try {
      const data = await authRequest({ action: 'session', session_token: token });
      if (!data.authenticated || !data.user) throw new Error('Сессия не найдена.');
      sessionStorage.setItem('skebob_user', JSON.stringify(data.user));
      showSignedIn(data.user);
    } catch {
      sessionStorage.removeItem('skebob_session_token');
      sessionStorage.removeItem('skebob_user');
      showSignedOut();
    }
  }

  // В Telegram Mini App предлагаем открыть тот же сайт во внешнем браузере,
  // где поддержка WebGPU обычно полнее.
  const openBrowserButton = document.querySelector('#openBrowser');
  const telegramWebApp = window.Telegram?.WebApp;
  if (telegramWebApp?.initData) {
    openBrowserButton.hidden = false;
    openBrowserButton.addEventListener('click', () => {
      try {
        if (typeof telegramWebApp.openLink === 'function') {
          telegramWebApp.openLink(PUBLIC_APP_URL);
          return;
        }
      } catch (error) {
        console.warn('Telegram openLink failed:', error);
      }
      const opened = window.open(PUBLIC_APP_URL, '_blank', 'noopener,noreferrer');
      if (!opened) {
        alert('Открой Skebob AI в браузере по адресу: ' + PUBLIC_APP_URL);
      }
    });
  }

  document.querySelector('#telegramLogin').addEventListener('click', () => {
    if (sessionStorage.getItem('skebob_session_token')) {
      document.querySelector('#logoutButton').focus();
      return;
    }
    startTelegramLogin();
  });

  document.querySelector('#logoutButton').addEventListener('click', async () => {
    const token = sessionStorage.getItem('skebob_session_token');
    if (token) {
      try { await authRequest({ action: 'logout', session_token: token }); } catch {}
    }
    sessionStorage.removeItem('skebob_session_token');
    sessionStorage.removeItem('skebob_user');
    showSignedOut();
  });

  refreshAuthState();


  function addMessage(text, who) {
    const row = document.createElement('div');
    row.className = 'message ' + who;
    const avatar = document.createElement('div');
    avatar.className = 'mini-avatar';
    avatar.textContent = who === 'user' ? 'S' : '✳';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.append(avatar, bubble);
    conversation.append(row);
    row.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return bubble;
  }

  async function getAIEngine(statusBubble) {
    if (aiEngine) return aiEngine;
    if (aiEnginePromise) return aiEnginePromise;
    if (!('gpu' in navigator)) {
      throw new Error('В этом браузере нет WebGPU. Попробуй обновлённый Chrome или Edge на устройстве с поддерживаемой графикой.');
    }
    aiEnginePromise = (async () => {
      statusBubble.textContent = 'Загружаю улучшенную модель Skebob AI…';
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      const progress = (report) => {
        const text = typeof report?.text === 'string' ? report.text : 'Подготавливаю локальную модель…';
        statusBubble.textContent = text;
      };
      try {
        const engine = await webllm.CreateMLCEngine(WEBLLM_MODEL_ID, {
          initProgressCallback: progress
        });
        statusBubble.textContent = 'Улучшенная модель готова.';
        aiEngine = engine;
        return engine;
      } catch (primaryError) {
        let lastError = primaryError;
        for (const fallbackModelId of WEBLLM_FALLBACK_MODEL_IDS) {
          try {
            statusBubble.textContent = 'Модель 3B не запустилась. Пробую ' + fallbackModelId + '…';
            const engine = await webllm.CreateMLCEngine(fallbackModelId, { initProgressCallback: progress });
            statusBubble.textContent = 'Запущена совместимая модель: ' + fallbackModelId;
            aiEngine = engine;
            return engine;
          } catch (fallbackError) { lastError = fallbackError; }
        }
        throw new Error('Не удалось запустить локальный ИИ. ' + (lastError?.message || 'Проверь поддержку WebGPU и свободную память устройства.'));
      }
    })();
    try {
      return await aiEnginePromise;
    } catch (error) {
      aiEnginePromise = null;
      throw error;
    }
  }

  async function send(text = promptBox.value.trim()) {
    if (!text || sending) return;
    welcome.style.display = 'none';
    conversation.style.display = 'flex';
    addMessage(text, 'user');
    promptBox.value = '';
    promptBox.style.height = 'auto';

    // Локальный ИИ доступен без входа в Telegram.
    sending = true;
    const sendButton = document.querySelector('#send');
    sendButton.disabled = true;
    sendButton.textContent = 'Думаю…';
    const statusBubble = addMessage('Запускаю локальный ИИ. При первом запуске модель нужно загрузить — это может занять некоторое время.', 'assistant');
    const messageForModel = attachedContext
      ? text + '\n\nМатериалы пользователя:\n' + attachedContext
      : text;
    history.push({ role: 'user', content: messageForModel });
    attachedContext = '';
    const attachmentStatus = document.querySelector('#attachmentStatus');
    attachmentStatus.textContent = '';
    attachmentStatus.style.display = 'none';
    const currentChat = activeChat();
    if (currentChat && currentChat.messages.length === 0) {
      currentChat.title = text.replace(/\s+/g, ' ').slice(0, 38) || 'Новый чат';
    }
    saveChat();
    try {
      const engine = await getAIEngine(statusBubble);
      statusBubble.textContent = 'Готовлю ответ…';
      const stream = await engine.chat.completions.create({
        messages: [
          { role: 'system', content: [
            'Ты — Skebob AI, универсальный ИИ-помощник. Будь дружелюбным, спокойным, уважительным и практичным.',
            'Язык: отвечай на языке пользователя; если он пишет по-русски, используй естественный современный русский.',
            'Точность: сначала пойми задачу. Не выдумывай факты, источники, функции, результаты действий или проверку кода. Если не уверен или данных недостаточно, прямо скажи об этом.',
            'Полезность: отвечай прямо на вопрос. Для сложной задачи разбивай решение на понятные шаги. Не добавляй длинное вступление и повторения.',
            'Диалог: учитывай предыдущие сообщения этого чата. Не проси повторить уже предоставленную информацию. Если без уточнения нельзя дать хороший ответ, задай один самый важный короткий вопрос.',
            'Формат: используй Markdown, короткие заголовки и списки, когда они помогают. Для кода указывай язык блока, пиши цельный пример и кратко объясняй, куда его поместить. Не утверждай, что код запускался, если этого не происходило.',
            'Обучение: объясняй сложное простыми словами, при необходимости приводи небольшой пример. Подстраивай глубину ответа под вопрос.',
            'Творчество: соблюдай заданные стиль, формат и ограничения; не выдавай догадки за реальные сведения.',
            'Безопасность: не помогай причинять вред себе или другим, совершать опасные действия, обходить защиту или нарушать приватность. В рискованных ситуациях предложи безопасный вариант.',
            'Если пользователь просит текущую информацию, к которой у тебя нет доступа, предупреди, что не можешь проверить её в реальном времени.',
            'Главная цель — дать честный, понятный и применимый ответ, а не просто звучать уверенно.'
          ].join('\\n') },
          ...history.slice(-14)
        ],
        temperature: reasoningMode ? 0.3 : 0.55,
        top_p: 0.9,
        repetition_penalty: 1.08,
        max_tokens: reasoningMode ? 1600 : 900,
        stream: true
      });
      let reply = '';
      statusBubble.textContent = '';
      for await (const chunk of stream) {
        const piece = chunk?.choices?.[0]?.delta?.content;
        if (typeof piece === 'string' && piece) {
          reply += piece;
          statusBubble.textContent = reply;
        }
      }
      if (!reply.trim()) throw new Error('Модель вернула пустой ответ. Попробуй ещё раз.');
      history.push({ role: 'assistant', content: reply.trim() });
      saveChat();
    } catch (error) {
      statusBubble.textContent = error instanceof Error
        ? 'Не удалось запустить локальный ИИ: ' + error.message
        : 'Не удалось запустить локальный ИИ. Попробуй обновить страницу.';
      history.pop();
      saveChat();
    } finally {
      sending = false;
      sendButton.disabled = false;
      sendButton.textContent = 'Отправить ↑';
      renderChatList();
      promptBox.focus();
    }
  }

  restoreChat();

  document.querySelector('#send').addEventListener('click', () => send());
  promptBox.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.querySelectorAll('[data-prompt]').forEach(button =>
    button.addEventListener('click', () => send(button.dataset.prompt))
  );
  document.querySelector('#newChat').addEventListener('click', createChat);
  document.querySelector('#mode').addEventListener('click', e => {
    reasoningMode = !reasoningMode;
    e.currentTarget.textContent = reasoningMode ? '✧ Режим: подробный' : '✧ Режим: обычный';
    e.currentTarget.setAttribute('aria-pressed', String(reasoningMode));
  });
  const fileInput = document.querySelector('#fileInput');
  document.querySelector('#attach').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    if (!file) return;
    const status = document.querySelector('#attachmentStatus');
    const allowed = /\.(txt|md|csv|json|html|css|js|py|xml)$/i.test(file.name);
    if (!allowed) {
      alert('Пока поддерживаются текстовые файлы: TXT, MD, CSV, JSON, HTML, CSS, JS, PY и XML.');
      fileInput.value = '';
      return;
    }
    if (file.size > 100 * 1024) {
      alert('Файл слишком большой. Максимальный размер — 100 КБ.');
      fileInput.value = '';
      return;
    }
    try {
      const content = await file.text();
      if (!content.trim()) throw new Error('Файл пустой.');
      attachedContext = 'Файл: ' + file.name + '\n' + content.slice(0, 100000);
      status.textContent = 'Прикреплён: ' + file.name + ' · ' + Math.ceil(file.size / 1024) + ' КБ';
      status.style.display = 'block';
    } catch (error) {
      alert(error.message || 'Не удалось прочитать файл.');
    } finally {
      fileInput.value = '';
    }
  });
  document.querySelector('#share').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      alert('Ссылка скопирована');
    } catch {
      alert('Скопируй адрес страницы из браузера.');
    }
  });
  promptBox.addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 170) + 'px';
  });
</script>
</body>
</html>
